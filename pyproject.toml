[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "god-tier-soul-mathematics"
version = "2.1.0"
description = "USIF v2.1 — Unified Soul Invariant Framework: a formal, computable synthesis of UHIF, UHG/IEG, IIRO/UBF, Correlation Continuum, Degens, Hollow/Generic/Apostatic ontologies"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "TaoishTechy"}]
requires-python = ">=3.10"
keywords = ["usif", "soul", "invariant", "topology", "holographic", "forcing", "palimpsest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
soulmath = "soulmath.cli:main"

[project.urls]
Homepage = "https://github.com/TaoishTechy/god-tier-soul-mathematics"
Repository = "https://github.com/TaoishTechy/god-tier-soul-mathematics"
Issues = "https://github.com/TaoishTechy/god-tier-soul-mathematics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
